# homepage information
author: Anthony Burton
author-bio: "I am a lecturer in Critical Data & AI and a postdoctoral researcher in the Media Studies department at the University of Amsterdam. I work on technofascism, Silicon Valley ideology, and platform temporalities. I finished my Ph.D. in Communication at Simon Fraser University, where I was a Mellon-SFU Data Fluencies Fellow at the Digital Democracies Institute. My dissertation, *Fear of Mimesis: Technofascism and Intelligence in Silicon Valley*, is about the relationship between social theory, intelligence, desire, and mimesis in contemporary late fascist politics.

You can find more information in the menus above."
