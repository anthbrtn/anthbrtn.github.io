# change the followings to match your Github username and repo name
baseurl: "" # the name of your github repo
url: "https://anthbrtn.com" # the url of your github pages

# site information used in page title, meta data etc.
title: "Anthony Burton"
description: "Postdoctoral researcher and lecturer at the University of Amsterdam."

# browser UI colour (mobile chrome)
theme-color: "#000000"

# homepage information
author:
  name: Anthony Burton
  twitter: anthbrtn
author-bio: "Postdoctoral researcher and lecturer in media studies at the University of Amsterdam. Ph.D. in Communication (SFU)."
#author-image: onepx.png  # file must be in the /assets/img/ folder

# navigation menu
show-nav-menu: true

nav-menu:
- text: About
  permalink: about
- text: Presentations
  permalink: presentations
- text: Publications
  permalink: publications
- text: Curriculum Vitae
  permalink: cv
- text: Algorithmic Authenticity
  permalink: "https://meson.press/books/algorithmic-authenticity/"
- text: Contact
  permalink: contact

# social media links (sidebar buttons) - use false to turn off any
twitterlink: https://twitter.com/anthbrtn
facebook: false
instagram: false
github: https://gitlab.com/anthbrtn
linkedin: false
medium: false
google-scholar: https://scholar.google.com/citations?user=FxoLSjYAAAAJ&hl=en&inst=10441630620217902552
orcid: https://orcid.org/0000-0001-6474-0313
email: "ab [at] anthbrtn [dot] com"

# jekyll-seo-tag metadata (link previews)
twitter:
  username: anthbrtn
  card: summary_large_image

# footer information
#footer-msg: "Powered by Tailpages"
#footer-msg-link: https://github.com/harrywang/tailpages

# google analytics
#google-analytics: G-WCRC1TC2V5

# default social-share image (feeds og:image / twitter:image and the large card)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png

# jekyll plugins - no need to change
plugins:
    - jekyll-seo-tag

disable_disk_cache: true
