# change the followings to match your Github username and repo name
baseurl: "" # the name of your github repo
url: "https://anthbrtn.com" # the url of your github pages

# site information used in page title, meta data etc.
title: "Anthony Burton"
description: "Internet culture researcher"

# browser UI colour (mobile chrome)
theme-color: "#000000"

# homepage information
author:
  name: Anthony Burton
  twitter: anthbrtn
author-bio: "I am a lecturer in Critical Data & AI and a postdoctoral researcher in the Media Studies department at the University of Amsterdam. I finished my Ph.D. in Communication at Simon Fraser University, where I was a Mellon-SFU Data Fluencies Fellow at the Digital Democracies Institute. My dissertation is about the relationship between social theory, intelligence, desire, and mimesis in contemporary late fascist politics.

You can find more information in the menus above."
#author-image: onepx.png  # file must be in the /assets/img/ folder

# navigation menu
show-nav-menu: true

nav-menu:
